version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: foodbridge_postgres
    restart: always
    environment:
      POSTGRES_DB: foodbridge_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: foodbridge_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:password@postgres:5432/foodbridge_ai
      - SECRET_KEY=super-secret-key-change-in-production-12345
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - CORS_ORIGINS=http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: foodbridge_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
